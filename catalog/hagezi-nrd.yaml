homepage: https://github.com/hagezi/dns-blocklists#nrd
source: hagezi/nrd
maintainer: HaGeZi
license: GPL-3.0
topics:
  - nrd
  - malware
  - phishing
region: global
languages:
  - en
family: hagezi-nrd
variant: default
risk: high
breaks:
